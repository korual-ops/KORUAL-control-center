name: KORUAL Platform CI

on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/korual-platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/korual-platform-ci.yml'
  workflow_dispatch:

jobs:
  build-platform:
    name: Build KORUAL Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package.json

      - name: Install dependencies
        working-directory: platform
        run: npm install --no-audit --no-fund

      - name: Check catalog module syntax
        working-directory: platform
        run: node --check category-catalog.js && node --check category-hub.js

      - name: Run automated tests
        working-directory: platform
        run: npm test

      - name: Build platform
        working-directory: platform
        run: npm run build

      - name: Validate browser scripts
        working-directory: platform
        run: |
          node --check quote-trust.js
          node --check site.js
          node --check ui-v7.js

      - name: Smoke test built production server and required assets
        working-directory: platform
        run: |
          PORT=3977 node static-server.mjs > /tmp/korual-platform-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:3977/healthz | grep -q '"ok":true'; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/korual-platform-smoke.log; exit 1; fi
          curl --fail --silent --show-error http://127.0.0.1:3977/ -o /tmp/korual-index.html
          grep -q '/quote-trust.js' /tmp/korual-index.html
          curl --fail --silent --show-error http://127.0.0.1:3977/quote-trust.js -o /tmp/korual-quote-trust.js
          grep -q 'KorualQuoteTrust' /tmp/korual-quote-trust.js
          curl --fail --silent --show-error http://127.0.0.1:3977/site.js -o /tmp/korual-site.js
          grep -q 'validateUnique' /tmp/korual-site.js
          echo "KORUAL production server smoke tests passed"

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: korual-platform-dist
          path: platform/dist
