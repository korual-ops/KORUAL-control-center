name: KORUAL Platform CI

on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/korual-platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/korual-platform-ci.yml'
  workflow_dispatch:

jobs:
  build-platform:
    name: Build KORUAL Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package.json

      - name: Install dependencies
        working-directory: platform
        run: npm install

      - name: Build platform
        working-directory: platform
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: korual-platform-dist
          path: platform/dist
