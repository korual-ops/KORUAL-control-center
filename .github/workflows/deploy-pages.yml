name: Deploy KORUAL to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package.json

      - name: Install dependencies
        working-directory: platform
        run: npm install --no-audit --no-fund

      - name: Build portable KORUAL frontend
        working-directory: platform
        env:
          VITE_KORUAL_API_BASE_URL: https://dtmmjkikyfgkeimhevso.supabase.co/functions/v1/korual-marketplace
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: platform/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
