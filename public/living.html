<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KORUAL | Living Concierge</title><style>
:root{color-scheme:dark;--gold:#d0b47e;--bg:#101114;--card:#1b1d21;--line:#383a40}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f5f0;font:15px/1.6 system-ui,sans-serif}header,main,footer{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font:24px Georgia,serif;letter-spacing:5px;color:var(--gold)}a{color:var(--gold)}h1{font:clamp(32px,5vw,58px)/1.15 Georgia,serif;margin:12px 0}h2{font-size:20px}p,small{color:#b8bac0}.hero{padding:32px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}section,article{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px}label{display:block;margin:12px 0 4px}input,select,button{font:inherit}input:not([type=checkbox]),select{width:100%;background:var(--bg);border:1px solid #555;color:#fff;padding:12px;border-radius:8px}button{background:var(--gold);color:#111;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.result{white-space:pre-wrap;overflow-wrap:anywhere}.provider{padding:12px 0;border-bottom:1px solid var(--line)}.tag{color:var(--gold);letter-spacing:2px;font-size:12px}footer{font-size:12px;color:#aaa}@media(max-width:720px){.grid{grid-template-columns:1fr}header,main,footer{padding:16px}}
</style></head><body><header><div class="brand">KORUAL</div><a href="/">Control Center</a></header><main><div class="hero"><div class="tag">LIVING CONCIERGE</div><h1>더 나은 일상,<br>하나의 코루알.</h1><p>검증된 생활서비스 공급업체를 조회하고 견적을 요청하세요.</p></div><div class="grid"><section><h2>서비스 비교</h2><form id="search"><label for="service">서비스</label><select id="service" required><option>입주청소</option><option>이사</option><option>인터넷</option><option>정수기</option><option>인테리어</option><option>수리·시공</option></select><label for="region">지역 (등록 지역명)</label><input id="region" maxlength="100" placeholder="예: 영종도" required minlength="2"><button>등록 업체 조회</button></form><div id="results" role="status" aria-live="polite" class="result">지역과 서비스를 선택하세요.</div></section><section><h2>견적 요청</h2><form id="request"><p>왼쪽에서 선택한 서비스 및 지역으로 요청합니다. 예약 확정이나 결제는 아닙니다.</p><label for="date">희망 날짜</label><input id="date" type="date" required><label for="name">이름</label><input id="name" required minlength="2" maxlength="50" autocomplete="name"><label for="phone">연락처</label><input id="phone" type="tel" required maxlength="20" autocomplete="tel"><label><input id="consent" type="checkbox" required> 견적 상담을 위한 이름·연락처·지역·희망일 수집에 동의합니다.</label><small>운영 전 개인정보 처리방침과 보유기간 확인이 필요합니다. 본 화면은 개발 검토용으로 실제 개인정보 전송을 기본 차단합니다.</small><br><button id="submit" disabled>견적 요청 (운영 승인 필요)</button></form><div id="receipt" role="status" class="result"></div></section></div></main><footer> KORUAL · 실제 등록 데이터만 표시 · 개발 검토용</footer><script>
const el=id=>document.getElementById(id), won=n=>Number.isFinite(Number(n))&&n!=null?Number(n).toLocaleString('ko-KR')+'원':'미집계';
async function json(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'REQUEST_FAILED');return data}
function line(parent,text,cls){const div=document.createElement('div');div.textContent=text;if(cls)div.className=cls;parent.append(div)}
el('search').addEventListener('submit',async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;const out=el('results');out.textContent='조회 중…';try{const q=new URLSearchParams({service:el('service').value,region:el('region').value.trim()});const d=await json('/marketplace/summary?'+q);out.replaceChildren();line(out,d.benchmark?'참고가격: '+won(d.benchmark.median_amount)+' / 표본 '+(d.benchmark.sample_count??'미집계'):'해당 지역 참고가격 없음');for(const p of d.providers||[])line(out,p.name+' · 인증업체 · 평점 '+(p.rating??'미집계')+' · 후기 '+(p.review_count??'미집계'),'provider');if(!d.providers?.length)line(out,'등록된 인증 업체가 없습니다.');}catch{out.textContent='조회할 수 없습니다. 서버 설정 또는 연결 상태를 확인하세요.'}finally{button.disabled=false}});
el('request').addEventListener('submit',e=>{e.preventDefault();el('receipt').textContent='개발 검토 환경에서는 개인정보를 서버로 전송하지 않습니다.'});
</script></body></html>
