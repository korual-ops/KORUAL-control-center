<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="KORUAL AI Life Decision OS — 생활 문제를 분석하고 필요한 서비스와 가격을 비교합니다." />
    <meta name="application-name" content="KORUAL" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="generator" content="KORUAL Deploy" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('korual-theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#08090b' : '#f7f8fa');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>KORUAL Beta — AI Life OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
