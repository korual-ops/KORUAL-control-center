<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="KORUAL AI Life Decision OS — 생활 문제를 분석하고 필요한 서비스와 가격을 비교합니다." />
    <meta name="application-name" content="KORUAL" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="generator" content="KORUAL Deploy" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('korual-theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#08090b' : '#f7f8fa');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>KORUAL Beta — AI Life OS</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fa;color:#17202a;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
        <section style="width:min(560px,100%);padding:36px;border:1px solid #e2e7ec;border-radius:24px;background:#fff;box-shadow:0 24px 80px rgba(38,52,68,.10);text-align:center">
          <div style="width:52px;height:52px;margin:0 auto 18px;display:grid;place-items:center;border-radius:16px;background:#fff6e7;color:#a97833;font-size:24px">✦</div>
          <div style="color:#9a7033;font-size:10px;font-weight:800;letter-spacing:.14em">KORUAL BETA</div>
          <h1 style="margin:10px 0 8px;font-size:30px;letter-spacing:-.04em">한 번 묻고, 좋은 선택까지.</h1>
          <p style="margin:0;color:#6f7a84;font-size:13px;line-height:1.7">KORUAL 플랫폼을 불러오는 중입니다.</p>
          <noscript><p style="margin-top:16px;color:#b14f4f">이 브라우저에서는 JavaScript 실행이 필요합니다.</p></noscript>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
