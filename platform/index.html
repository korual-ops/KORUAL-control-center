<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#f6f8fb" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="KORUAL — Travel, Commerce, AI and Operations in one platform." />
  <meta name="application-name" content="KORUAL" />
  <meta name="format-detection" content="telephone=no" />
  <title>KORUAL — One Platform</title>
  <script>
    try {
      const theme = localStorage.getItem('korual-theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    } catch (_) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
