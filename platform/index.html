<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="KORUAL AI Life Decision OS — 생활 문제를 분석하고 필요한 서비스와 가격을 비교합니다." />
    <meta name="application-name" content="KORUAL" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="generator" content="KORUAL Deploy" />
    <script>
      (function () {
        try {
          var themeVersion = localStorage.getItem('korual-theme-version');
          var saved = localStorage.getItem('korual-theme');
          var theme = themeVersion === 'R4.1' && (saved === 'dark' || saved === 'light') ? saved : 'light';
          if (themeVersion !== 'R4.1') {
            localStorage.setItem('korual-theme', 'light');
            localStorage.setItem('korual-theme-version', 'R4.1');
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#08090b' : '#f7f8fa');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>KORUAL Beta — AI Life OS</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;padding:72px 24px;background:linear-gradient(180deg,#fbfcfd,#f4f6f8);color:#17202a;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
        <section style="width:min(1100px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:40px;align-items:center">
          <div>
            <div style="display:inline-flex;align-items:center;gap:7px;color:#9a7033;font-size:11px;font-weight:800;letter-spacing:.12em">✦ KORUAL BETA · R6.2</div>
            <h1 style="margin:18px 0 14px;font-size:clamp(42px,6vw,72px);line-height:1.02;letter-spacing:-.055em">한 번 묻고,<br><span style="color:#b48137">좋은 선택까지.</span></h1>
            <p style="max-width:580px;margin:0;color:#66727d;font-size:15px;line-height:1.72">이사, 입주청소, 인터넷, 정수기 같은 생활 서비스를 한 화면에서 정리하고 비교합니다.</p>
            <div style="margin-top:24px;padding:16px 18px;border:1px solid #dce3e9;border-radius:16px;background:#fff;box-shadow:0 18px 50px rgba(35,49,65,.08);color:#8a949e;font-size:14px">예: 다음 달 청라로 이사하는데 무엇부터 준비해야 해?</div>
          </div>
          <aside style="padding:24px;border:1px solid #e1e6ea;border-radius:22px;background:#fff;box-shadow:0 24px 70px rgba(39,54,70,.09)">
            <div style="font-size:10px;font-weight:800;letter-spacing:.12em;color:#9a7033">KORUAL SUMMARY</div>
            <h2 style="margin:10px 0 18px;font-size:24px;letter-spacing:-.035em">필요한 것만 먼저 정리</h2>
            <div style="display:grid;gap:10px">
              <div style="padding:14px;border-radius:14px;background:#f7f9fb"><b>추천 서비스</b><div style="margin-top:6px;color:#6f7a84;font-size:13px">입주청소 · 인터넷 · 이사</div></div>
              <div style="padding:14px;border-radius:14px;background:#fff9ef"><b>가격 기준</b><div style="margin-top:6px;color:#8f642a;font-size:13px">적정 범위부터 확인</div></div>
              <div style="padding:14px;border-radius:14px;background:#f7f9fb"><b>업체 비교</b><div style="margin-top:6px;color:#6f7a84;font-size:13px">검증 데이터 기반 연결</div></div>
            </div>
          </aside>
        </section>
        <noscript><p style="max-width:1100px;margin:24px auto 0;color:#b14f4f">인터랙티브 기능 사용을 위해 JavaScript 실행이 필요합니다.</p></noscript>
      </main>
    </div>
    <script type="module" data-korual-entry src="/src/main.js"></script>
    <script>
      (function () {
        window.__KORUAL_READY__ = false;
        window.__KORUAL_BOOT_STAGE__ = window.__KORUAL_BOOT_STAGE__ || 'html';

        function report(stage) {
          try {
            fetch('/__boot?stage=' + encodeURIComponent(stage) + '&build=2026.09.19-R6.2', {
              cache: 'no-store',
              keepalive: true,
              credentials: 'omit'
            }).catch(function(){});
          } catch (e) {}
        }

        report('html');

        window.addEventListener('error', function () {
          if (!window.__KORUAL_READY__) report('global-error');
        }, true);

        setTimeout(function () {
          if (window.__KORUAL_READY__) return;

          report('stalled-' + (window.__KORUAL_BOOT_STAGE__ || 'html'));

          var notice = document.createElement('div');
          notice.id = 'korual-boot-notice';
          notice.setAttribute('role', 'status');
          notice.style.cssText =
            'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;' +
            'display:flex;align-items:center;gap:10px;max-width:calc(100% - 28px);padding:10px 12px;' +
            'border:1px solid #e2d2b1;border-radius:12px;background:rgba(255,255,255,.96);' +
            'box-shadow:0 14px 45px rgba(30,44,60,.14);font:600 12px/1.4 system-ui;color:#5f6973';
          notice.innerHTML =
            '<span style="width:8px;height:8px;border-radius:50%;background:#c49348;display:inline-block"></span>' +
            '<span>최신 앱 연결을 자동 복구 중입니다.</span>';
          document.body.appendChild(notice);

          var stage = window.__KORUAL_BOOT_STAGE__ || 'html';
          if (stage !== 'html') {
            report('slow-' + stage);
            return;
          }

          var script = document.querySelector('script[data-korual-app][src],script[data-korual-entry][src]');
          if (!script || window.__KORUAL_BOOT_RETRY__) return;

          window.__KORUAL_BOOT_RETRY__ = true;
          var retry = document.createElement('script');
          retry.src = script.src + (script.src.indexOf('?') >= 0 ? '&' : '?') + 'retry=R62';
          retry.async = true;
          retry.setAttribute('data-korual-retry', 'true');

          retry.onload = function () {
            report('retry-loaded');
          };

          retry.onerror = function () {
            report('retry-failed-classic');
            var label = notice.querySelector('span:last-child');
            if (label) label.textContent = '앱 연결이 지연되고 있습니다. 새로고침하면 최신 버전으로 다시 연결합니다.';
            notice.style.cursor = 'pointer';
            notice.onclick = function () {
              window.location.reload();
            };
          };

          document.head.appendChild(retry);
        }, 2500);

        setTimeout(function () {
          if (window.__KORUAL_READY__) {
            var notice = document.getElementById('korual-boot-notice');
            if (notice) notice.remove();
          }
        }, 5000);
      })();
    </script>
  </body>
</html>
